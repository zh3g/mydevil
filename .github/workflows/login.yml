name: Serv00/CT8 Login Tasks

on:
  workflow_dispatch:
  schedule:
    # cron UTC时区，UTC13:15 = 北京时间21:15
    - cron: "15 13 1 * *"

env:
  ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PUPPETEER_ARGS: "--no-sandbox --disable-setuid-sandbox"
  DEBUG: puppeteer:*

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用node生成accounts.json，同时校验JSON，避开bash here‑doc YAML语法bug
      - name: Create accounts.json & validate JSON
        run: |
          node -e "
            const fs=require('fs');
            const raw=process.env.ACCOUNTS_JSON;
            const obj=JSON.parse(raw);
            fs.writeFileSync('./accounts.json',JSON.stringify(obj,null,2));
            console.log('✅ accounts.json 创建成功，JSON格式校验通过');
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install system dependencies for puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libasound2

      - name: Install dependencies
        run: npm install puppeteer axios

      - name: Print runtime debug info
        run: |
          echo "==== 环境调试信息 ===="
          node -v
          npm -v
          curl -s ifconfig.me
          echo ""
          echo "GitHub Actions出口IP（上面输出）"
          echo "======================"

      - name: Login into Serv00/CT8 (DEBUG模式)
        run: xvfb-run --server-args="-screen 0 1280x720x24" node src/main.js 2>&1 | tee run-log.txt

      - name: Upload full run log as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-execute-log
          path: run-log.txt
